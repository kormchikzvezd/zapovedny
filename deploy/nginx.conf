server {
    listen 80;
    server_name zapovedny-dom.online www.zapovedny-dom.online;

    # Certbot перепишет этот блок и добавит редирект на HTTPS.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Без этих заголовков проверка Origin увидит http:// вместо https://
        # и отклонит заявки с кодом 403.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    client_max_body_size 64k;
}

server {
    listen 443 ssl;
    http2 on;
    server_name zapovedny-dom.online www.zapovedny-dom.online;

    ssl_certificate     /etc/letsencrypt/live/zapovedny-dom.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zapovedny-dom.online/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /images/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 64k;
}